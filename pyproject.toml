[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myapp-yourname"
version = "0.1.0"
description = "Anonymous loan applications with a role-based approval workflow"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["fastapi", "uvicorn"]

[project.scripts]
myapp = "myapp.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/myapp"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
